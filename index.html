<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mein Tagebuch</title>

<link rel="stylesheet" href="style.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

</head>


<body>


<div class="app">


<div id="buch" class="seite">


<h1>Mein Tagebuch</h1>

<input id="name"
placeholder="Dein Name">


<div id="datum"></div>



<textarea id="text"
placeholder="Schreibe hier..."></textarea>



<img id="bild">


</div>



<div class="steuerung">


<button onclick="zurueck()">
◀
</button>


<span id="anzeige">
1 / 1
</span>


<button onclick="weiter()">
▶
</button>


</div>



<button onclick="bildHinzufuegen()">
📷 Bild hinzufügen
</button>


<button onclick="speichern()">
💾 Speichern
</button>


<button onclick="screenshot()">
📸 Seite speichern
</button>


<input 
type="file"
id="datei"
accept="image/*"
hidden>


</div>


<script src="script.js"></script>

</body>

</html>
